name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'sipenamas_v2_frontend/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./sipenamas_v2_frontend

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: './sipenamas_v2_frontend/package-lock.json'

    - name: Install Dependencies
      run: npm ci

    - name: Build Application
      run: npm run build
      env:
        VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

    - name: Deploy to VPS
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.DEPLOY_HOST }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.DEPLOY_KEY }}
        source: "sipenamas_v2_frontend/dist/"
        target: "/home/wisnu/SIPENAMAS_V2/"
        strip_components: 0

    - name: Update Permissions
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.DEPLOY_HOST }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.DEPLOY_KEY }}
        script: |
          chown -R www-data:www-data /home/wisnu/SIPENAMAS_V2/sipenamas_v2_frontend/dist
