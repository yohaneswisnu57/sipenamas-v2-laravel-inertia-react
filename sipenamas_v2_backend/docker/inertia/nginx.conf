user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    # Redirect relatif: host dan port asli milik nginx host, bukan 127.0.0.1:8090.
    absolute_redirect off;
    client_max_body_size 50m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    server {
        # Container memakai network host: hanya loopback, nginx host yang
        # meneruskan https://sipenamasdev.ukwms.ac.id/refactor/inertia/ ke sini.
        listen 127.0.0.1:8090;
        server_name _;
        root /var/www/html;
        index index.php;

        location = /refactor/inertia {
            return 301 /refactor/inertia/;
        }

        location ^~ /refactor/inertia/build/ {
            expires 1y;
            access_log off;
            add_header Cache-Control "public, immutable";
        }

        location ^~ /refactor/inertia/ {
            try_files $uri $uri/ /refactor/inertia/index.php?$query_string;

            location ~ \.php$ {
                fastcgi_split_path_info ^(.+\.php)(/.+)$;
                fastcgi_pass unix:/run/php-fpm.sock;
                fastcgi_index index.php;
                include fastcgi_params;
                fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
                fastcgi_param SCRIPT_NAME $fastcgi_script_name;
                fastcgi_read_timeout 120s;
            }
        }

        location ~ /\.(?!well-known) {
            deny all;
        }

        location / {
            return 404;
        }
    }
}
